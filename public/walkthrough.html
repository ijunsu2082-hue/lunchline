<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LunchLine walkthrough</title>
  <meta name="description" content="A 90 second animated tour of LunchLine: scan, tap Good, Mid or Bad, and the kitchen listens.">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/walkthrough.css">
</head>
<body>
  <div class="shell">
    <div id="stage" role="img" aria-label="Animated walkthrough of LunchLine. Press space to pause.">
      <div class="bar"><i id="prog"></i></div>
      <div class="dots" id="dots"></div>
      <div class="ctl"><button id="pp" type="button">Pause</button><button id="rs" type="button">Restart</button></div>
      <div id="scene"></div>
      <div id="cap"><small id="capk"></small><p id="capt"></p></div>
      <div id="cursor" hidden><svg viewBox="0 0 24 24"><path d="M4 2l15 8.5-6.4 1.7L16 20l-3 1-3.4-7.6L4.5 17z" fill="#131211" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
    </div>
  </div>
  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:600 18px sans-serif">The walkthrough needs JavaScript.</p></noscript>
  <script type="module" src="/walkthrough.js"></script>
</body>
</html>
